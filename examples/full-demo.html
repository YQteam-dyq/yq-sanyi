<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yq-sanyi 声明式示例</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      max-width: 900px;
      margin: 0 auto 24px;
      padding: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border-radius: 12px;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; opacity: 0.9; }
    main {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .section-title {
      color: #6366f1;
      margin: 8px 0 12px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    yq-greeting,
    yq-clock,
    yq-counter,
    yq-user-list {
      display: block;
    }
    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .row > * {
      flex: 1 1 220px;
    }
    .demo-note {
      max-width: 900px;
      margin: 24px auto 0;
      padding: 16px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>yq-sanyi 声明式示例</h1>
    <p>定义一次组件，然后直接以 HTML 标签使用，无需任何挂载代码。</p>
  </header>

  <main>
    <div>
      <div class="section-title">文本绑定与组件内部样式</div>
      <div class="row">
        <yq-greeting></yq-greeting>
        <yq-clock></yq-clock>
      </div>
    </div>

    <div>
      <div class="section-title">事件绑定与自动更新（改 state 就地重渲染）</div>
      <div class="row">
        <yq-counter></yq-counter>
        <yq-counter></yq-counter>
      </div>
    </div>

    <div>
      <div class="section-title">列表渲染 yq-for</div>
      <yq-user-list></yq-user-list>
    </div>
  </main>

  <p class="demo-note">
    页面上的每个自定义标签都是独立组件实例：两个计数器互不影响；组件样式各自隔离；
    标签从页面移除时组件自动清理。标签名必须包含连字符（如 yq-counter），
    这是浏览器对自定义元素的硬性要求。
  </p>

  <script src="../packages/core/dist/core.global.js"></script>
  <script>
    yq.define('yq-greeting', {
      template: '<div class="card greeting"><h3>{{ title }}</h3><p>{{ message }}</p></div>',
      style: '.card { border-left: 4px solid #10b981; }',
      script: function () {
        return {
          state: {
            title: '你好，yq-sanyi',
            message: '零依赖、无构建，组件即 HTML 标签。'
          }
        }
      }
    })

    yq.define('yq-clock', {
      template: '<div class="card clock"><span class="label">当前时间</span><b>{{ now }}</b><button yq-on:click="refresh">刷新</button></div>',
      style: '.card { border-left: 4px solid #6366f1; }',
      script: function () {
        return {
          state: { now: new Date().toLocaleTimeString() },
          refresh: function (state) {
            state.now = new Date().toLocaleTimeString()
          }
        }
      }
    })

    yq.define('yq-counter', {
      template: '<div class="card counter"><b>{{ count }}</b><button yq-on:click="dec">-</button><button yq-on:click="inc">+</button></div>',
      style: '.card { border-left: 4px solid #f59e0b; }',
      script: function () {
        return {
          state: { count: 0 },
          inc: function (state) {
            state.count = state.count + 1
          },
          dec: function (state) {
            state.count = state.count - 1
          }
        }
      }
    })

    yq.define('yq-user-list', {
      template: '<div class="card list"><div yq-for="user in users"><div class="user"><span>{{ user.name }}</span><em>{{ user.role }}</em></div></div></div>',
      style: '.card { border-left: 4px solid #ec4899; }',
      script: function () {
        return {
          state: {
            users: [
              { name: '张三', role: '前端工程师' },
              { name: '李四', role: '后端工程师' },
              { name: '王五', role: '产品经理' }
            ]
          }
        }
      }
    })
  </script>
</body>
</html>
