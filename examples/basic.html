<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yq-sanyi basic example</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
#status { padding: 1rem; border: 1px solid #ccc; border-radius: 0.5rem; }
.ok { color: #0a7d32; }
.fail { color: #b3261e; }
</style>
</head>
<body>
<h1>yq-sanyi phase 1 example</h1>
<p>core is loaded from a plain script tag, no build step and no runtime third-party code</p>
<div id="status">waiting</div>
<script src="../packages/core/dist/core.global.js"></script>
<script>
const entry = { name: 'demo-pill', template: '<span>hello</span>' };
window.yq.define('demo-pill', entry);
const found = window.yq.lookup('demo-pill');
const ok = found === entry && typeof window.yq.version === 'string';
const box = document.getElementById('status');
box.classList.add(ok ? 'ok' : 'fail');
box.textContent = ok ? 'core loaded: define and lookup ok, version ' + window.yq.version : 'core loaded: registry check failed';
</script>
</body>
</html>
