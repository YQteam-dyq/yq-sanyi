<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单渲染测试</title>
</head>
<body>
    <h1>简单渲染测试</h1>
    <div id="test-container"></div>
    
    <script src="../packages/core/dist/core.mjs"></script>
    
    <script>
        console.log('=== 开始测试渲染管线 ===');
        

        const template = `
            <div>
                <h1>{{ title }}</h1>
                <p>{{ message }}</p>
            </div>
        `;
        
        try {
            const component = createComponent({
                name: 'simple-test',
                template: template,
                script: () => ({
                    state: {
                        title: 'yq-sanyi',
                        message: '渲染管线测试成功！'
                    }
                }),
                container: document.getElementById('test-container')
            });
            
            mountComponent(component);
            
            console.log('✓ 组件创建成功');
            console.log('✓ 组件挂载成功');
            console.log('渲染结果:', component.root.innerHTML);
            

            if (component.root.innerHTML.includes('yq-sanyi') && 
                component.root.innerHTML.includes('渲染管线测试成功')) {
                console.log('✓ 渲染结果验证成功');
            } else {
                console.log('✗ 渲染结果验证失败');
            }
            

            component.state.title = 'yq-sanyi v2.0';
            updateComponent(component);
            
            console.log('更新后结果:', component.root.innerHTML);
            
            if (component.root.innerHTML.includes('yq-sanyi v2.0')) {
                console.log('✓ 更新功能测试成功');
            } else {
                console.log('✗ 更新功能测试失败');
            }
            
            console.log('=== 所有测试完成 ===');
            
        } catch (error) {
            console.error('测试失败:', error);
        }
    </script>
</body>
</html>
